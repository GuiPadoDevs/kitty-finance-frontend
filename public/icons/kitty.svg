<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Hello Kitty Cute Face -->
  <!-- Head & Ears -->
  <path d="M 45 60 C 35 30 55 20 75 40 C 90 35 110 35 125 40 C 145 20 165 30 155 60 C 185 85 185 145 150 165 C 130 175 70 175 50 165 C 15 145 15 85 45 60 Z" 
        fill="#FFFFFF" stroke="#333333" stroke-width="6" stroke-linejoin="round"/>
  
  <!-- Left Eye -->
  <ellipse cx="68" cy="112" rx="6.5" ry="9" fill="#333333"/>
  <!-- Right Eye -->
  <ellipse cx="132" cy="112" rx="6.5" ry="9" fill="#333333"/>
  
  <!-- Cute Nose -->
  <ellipse cx="100" cy="124" rx="7.5" ry="5.5" fill="#FBBF24" stroke="#333333" stroke-width="3"/>

  <!-- Left Whiskers -->
  <path d="M 45 105 L 18 100" stroke="#333333" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 43 118 L 14 120" stroke="#333333" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 45 132 L 20 140" stroke="#333333" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Right Whiskers -->
  <path d="M 155 105 L 182 100" stroke="#333333" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 157 118 L 186 120" stroke="#333333" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 155 132 L 180 140" stroke="#333333" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Iconic Red Bow on Right Ear -->
  <g transform="translate(130, 35) rotate(15) scale(0.65)">
    <!-- Left Wing -->
    <path d="M 48 50 C 30 30 8 32 12 52 C 15 68 32 68 48 52 Z" fill="#FF1E40" stroke="#333333" stroke-width="6"/>
    <ellipse cx="28" cy="50" rx="6" ry="3.5" transform="rotate(-15 28 50)" fill="#B3001B"/>
    <!-- Right Wing -->
    <path d="M 52 50 C 70 30 92 32 88 52 C 85 68 68 68 52 52 Z" fill="#FF1E40" stroke="#333333" stroke-width="6"/>
    <ellipse cx="72" cy="50" rx="6" ry="3.5" transform="rotate(15 72 50)" fill="#B3001B"/>
    <!-- Knot -->
    <ellipse cx="50" cy="50" rx="15" ry="13" fill="#FF1E40" stroke="#333333" stroke-width="6"/>
    <ellipse cx="46" cy="46" rx="4" ry="2.5" fill="#FFFFFF" opacity="0.6"/>
  </g>
</svg>
